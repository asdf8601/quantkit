name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  PYTHON_VERSION: "3.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl -- python -c "import quantkit; print(quantkit.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run pytest tests -v --cov
      - run: uv run coverage xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --no-default-groups --group lint
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv publish dist/*
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.TWINE_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
