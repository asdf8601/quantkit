name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  PYTHON_VERSION: "3.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl -- python -c "import quantkit; print(quantkit.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run pytest tests -v --cov
      - run: uv run coverage xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # ty also checks tests/, so it needs the test dependencies importable.
      - run: uv sync --locked --no-default-groups --group lint --group test
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  docs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --no-default-groups --group docs
      - run: uv run make -C docs html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html
      - id: deployment
        uses: actions/deploy-pages@v4

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10
      - run: uv publish dist/*
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.TWINE_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
